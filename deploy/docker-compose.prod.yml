# Production stack for one server. The pipeline (.github/workflows/ci-cd.yml) sends this file to the server with
# every release; deploy/deploy.sh installs it as /opt/jobfinder/docker-compose.yml. Do not edit the copy on the server.
#
# Beside it on the server, never in git:
#   .env         application settings and secrets, POSTGRES_PASSWORD, PUBLIC_BASE_URL, IMAGE_TAG (written by deploy.sh)
#   tunnel.env   TUNNEL_TOKEN=... for the Cloudflare Tunnel
#
# Nothing listens on a public port. People reach the web app through the Cloudflare Tunnel, whose public hostname
# points at http://frontend:3000. The web app is also on 127.0.0.1:3010 of the server for health checks.
name: jobfinder

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-backend: &backend
  image: ghcr.io/namanjain221995/jobsearch-backend:${IMAGE_TAG:?IMAGE_TAG is not set}
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+asyncpg://jobfinder:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@postgres:5432/jobfinder
    REDIS_URL: redis://redis:6379/0
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is not set}
    APP_ENV: production
    COOKIE_SECURE: "true"
    # Cloudflare appends the caller's address to X-Forwarded-For; it is the only way in.
    TRUST_FORWARDED_FOR: "true"
    TRUSTED_PROXY_HOPS: "1"
  logging: *logging

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: jobfinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder -d jobfinder"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    <<: *backend
    command: ["uvicorn", "app.portal.app:app", "--host", "0.0.0.0", "--port", "8010", "--no-access-log"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["arq", "app.portal.worker.WorkerSettings"]
    stop_grace_period: 30s      # time to put a running search back in the queue; the next worker resumes it
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    image: ghcr.io/namanjain221995/jobsearch-frontend:${IMAGE_TAG:?IMAGE_TAG is not set}
    environment:
      API_ORIGIN: http://backend:8010
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: [tunnel.env]
    depends_on: [frontend]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
