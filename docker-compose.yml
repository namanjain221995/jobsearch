# Local stack for AI Job Finder.
#   Infrastructure only (development):   docker compose up -d postgres redis
#   Whole application:                   docker compose --profile app up -d --build
name: jobfinder

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobfinder}     # local development default; set a real secret for any shared host
      POSTGRES_DB: ${POSTGRES_DB:-jobfinder}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobfinder} -d ${POSTGRES_DB:-jobfinder}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    profiles: ["app"]
    build: { context: ., dockerfile: Dockerfile }
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobfinder}:${POSTGRES_PASSWORD:-jobfinder}@postgres:5432/${POSTGRES_DB:-jobfinder}
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3010}
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    profiles: ["app"]
    build: { context: ., dockerfile: Dockerfile }
    command: ["uvicorn", "app.portal.app:app", "--host", "0.0.0.0", "--port", "8010", "--no-access-log"]
    env_file: [.env]
    environment: *backend_env
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8010"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build: { context: ., dockerfile: Dockerfile }
    command: ["arq", "app.portal.worker.WorkerSettings"]
    env_file: [.env]
    environment: *backend_env
    stop_grace_period: 30s      # time to put a running search back in the queue; the next worker resumes it
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://backend:8010
    environment:
      API_ORIGIN: http://backend:8010
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
